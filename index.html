<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Spirit Meter v2</title>
    <style>
        :root {
            --bg-color: #05160d;
            --panel-color: #124e31;
            --text-color: #f4ebd0;
            --gold: #b89047;
            --needle-color: #e11d48;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .snow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 1px, transparent 1px),
                        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 2px, transparent 2px),
                        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 1.5px, transparent 1.5px);
            background-size: 550px 550px, 350px 350px, 450px 450px;
            animation: snow-fall 20s linear infinite;
            z-index: 1;
        }

        @keyframes snow-fall {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 550px 1100px, 350px 700px, 450px 900px; }
        }

        .container {
            background-color: var(--panel-color);
            border: 6px double var(--gold);
            border-radius: 24px;
            width: 95vw;
            height: calc(95vw * 9 / 16);
            max-width: calc(95vh * 16 / 9);
            max-height: 95vh;
            aspect-ratio: 16 / 9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4% 5%;
            text-align: center;
            z-index: 10;
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(184, 144, 71, 0.1);
        }

        .header-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5vh;
        }

        h1 {
            font-family: Georgia, serif;
            margin: 0;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            font-size: clamp(2rem, 5.5vh, 4rem);
        }

        p {
            font-size: clamp(0.9rem, 2.2vh, 1.2rem);
            margin: 0;
            opacity: 0.9;
            max-width: 600px;
        }

        .gauge-wrapper {
            position: relative;
            width: min(50vw, 45vh);
            height: min(30vw, 27vh);
            margin: 0 auto;
            overflow: hidden;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
        }

        .gauge-track {
            fill: none;
            stroke-width: 18;
            stroke-linecap: round;
        }

        .needle-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .needle {
            position: absolute;
            bottom: 8%; 
            width: min(1vw, 8px);
            height: 70%;
            background-color: var(--needle-color);
            border-radius: 6px 6px 0 0;
            transform-origin: bottom center;
            transform: rotate(-90deg); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 5;
        }

        .needle-pivot {
            position: absolute;
            bottom: 3.5%;
            width: min(4vw, 32px);
            height: min(4vw, 32px);
            background-color: var(--gold);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .footer-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vh;
            width: 100%;
        }

        .status-label {
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: clamp(1.5rem, 4vh, 2.8rem);
            margin: 0;
            min-height: 4vh;
            color: white;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }

        button {
            background-color: #991b1b;
            color: white;
            border: 3px solid var(--gold);
            padding: clamp(10px, 1.8vh, 18px) clamp(24px, 3.5vw, 45px);
            font-size: clamp(1rem, 2.2vh, 1.4rem);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        .hidden {
            display: none !important;
        }

        .holly-decor {
            font-size: clamp(1.5rem, 4.5vh, 2.5rem);
            margin: 0 15px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="snow"></div>

    <div class="container">
        <div class="header-area">
            <!-- Modified title slightly so you can physically see if the new update took effect -->
            <h1 id="mainTitle"><span class="holly-decor">🎄</span>Spirit Meter v2<span class="holly-decor">🎄</span></h1>
            <p id="instruction">Sing, shout, or spread holiday cheer to test your Christmas Spirit level!</p>
        </div>

        <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 200 120">
                <defs>
                    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#22c55e" />
                        <stop offset="50%" stop-color="#eab308" />
                        <stop offset="100%" stop-color="#ef4444" />
                    </linearGradient>
                </defs>
                <path class="gauge-track" d="M 25,110 A 75,75 0 0,1 175,110" stroke="url(#gaugeGrad)" />
            </svg>
            <div class="needle-container">
                <div id="gaugeNeedle" class="needle"></div>
                <div class="needle-pivot"></div>
            </div>
        </div>

        <div class="footer-area">
            <div id="statusLabel" class="status-label">Ready to Listen...</div>
            <button id="startButton">Activate Meter</button>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const gaugeNeedle = document.getElementById('gaugeNeedle');
        const statusLabel = document.getElementById('statusLabel');
        const instruction = document.getElementById('instruction');

        let audioContext;
        let analyser;
        let microphone;
        
        let currentNeedlePosition = 0; 
        const decayRate = 0.003; 
        let isRunning = false; 
        const volumeThreshold = 45;

        startButton.onclick = function() {
            // Immediate change indicator: If you see this text change, the button is firing properly!
            instruction.innerText = "Requesting microphone authorization...";
            
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Browser Block: Your current link is insecure. Please make sure your address bar starts with HTTPS instead of HTTP.");
                instruction.innerText = "Error: Insecure Context Connection.";
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(stream) {
                    startButton.classList.add('hidden');
                    instruction.innerText = "Listening! Sing, shout, or make some noise!";

                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    
                    analyser.fftSize = 256;
                    microphone.connect(analyser);

                    isRunning = true; 
                    updateMeter();
                })
                .catch(function(err) {
                    alert('Hardware Permission Blocked:\n' + err.name + ': ' + err.message);
                    instruction.innerText = "Microphone access denied.";
                    console.error(err);
                });
        };

        function updateMeter() {
            function draw() {
                requestAnimationFrame(draw);
                
                if (isRunning && analyser) {
                    const bufferLength = analyser.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    analyser.getByteFrequencyData(dataArray);
                    
                    let total = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        total += dataArray[i];
                    }
                    const average = total / bufferLength;
                    
                    let liveVolumeRatio = Math.min(Math.max(average / volumeThreshold, 0), 1);
