<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Spirit Meter v6</title>
    
    <!-- ADVANCED SECURITY OVERRIDE: Tells browsers explicitly that this page is authorized to run microphone capture -->
    <meta http-equiv="Permissions-Policy" content="microphone=(self)">
    
    <style>
        :root {
            --bg-color: #05160d;
            --panel-color: #124e31;
            --text-color: #f4ebd0;
            --gold: #b89047;
            --needle-color: #e11d48;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .snow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 1px, transparent 1px),
                        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 2px, transparent 2px),
                        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 1.5px, transparent 1.5px);
            background-size: 550px 550px, 350px 350px, 450px 450px;
            animation: snow-fall 20s linear infinite;
            z-index: 1; 
            pointer-events: none; 
        }

        @keyframes snow-fall {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 550px 1100px, 350px 700px, 450px 900px; }
        }

        .container {
            background-color: var(--panel-color);
            border: 6px double var(--gold);
            border-radius: 24px;
            width: 95vw;
            height: calc(95vw * 9 / 16);
            max-width: calc(95vh * 16 / 9);
            max-height: 95vh;
            aspect-ratio: 16 / 9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4% 5%;
            text-align: center;
            z-index: 10; 
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(184, 144, 71, 0.1);
        }

        .header-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5vh;
        }

        h1 {
            font-family: Georgia, serif;
            margin: 0;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            font-size: clamp(2rem, 5.5vh, 4rem);
        }

        p {
            font-size: clamp(0.9rem, 2.2vh, 1.2rem);
            margin: 0;
            opacity: 0.9;
            max-width: 600px;
        }

        .gauge-wrapper {
            position: relative;
            width: min(50vw, 45vh);
            height: min(30vw, 27vh);
            margin: 0 auto;
            overflow: hidden;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
        }

        .gauge-track {
            fill: none;
            stroke-width: 18;
            stroke-linecap: round;
        }

        .needle-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .needle {
            position: absolute;
            bottom: 8%; 
            width: min(1vw, 8px);
            height: 70%;
            background-color: var(--needle-color);
            border-radius: 6px 6px 0 0;
            transform-origin: bottom center;
            transform: rotate(-90deg); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 5;
        }

        .needle-pivot {
            position: absolute;
            bottom: 3.5%;
            width: min(4vw, 32px);
            height: min(4vw, 32px);
            background-color: var(--gold);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .footer-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vh;
            width: 100%;
            z-index: 50; 
        }

        .status-label {
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: clamp(1.5rem, 4vh, 2.8rem);
            margin: 0;
            min-height: 4vh;
            color: white;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            cursor: pointer; 
        }

        button {
            background-color: #991b1b;
            color: white;
            border: 3px solid var(--gold);
            padding: clamp(10px, 1.8vh, 18px) clamp(24px, 3.5vw, 45px);
            font-size: clamp(1rem, 2.2vh, 1.4rem);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
            position: relative;
            z-index: 100; 
        }

        button:hover {
            background-color: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .hidden {
            display: none !important;
        }

        .holly-decor {
            font-size: clamp(1.5rem, 4.5vh, 2.5rem);
            margin: 0 15px;
            vertical-align: middle;
        }

        .debug-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-family: monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            z-index: 200;
            pointer-events: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="snow"></div>
    <div id="debugLog" class="debug-log">System: Ready</div>

    <div class="container">
        <div class="header-area">
            <h1><span class="holly-decor">🎄</span>Spirit Meter v6<span class="holly-decor">🎄</span></h1>
            <p id="instruction">Sing, shout, or spread holiday cheer to test your Christmas Spirit level!</p>
        </div>

        <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 200 120">
                <defs>
                    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#22c55e" />
                        <stop offset="50%" stop-color="#eab308" />
                        <stop offset="100%" stop-color="#ef4444" />
                    </linearGradient>
                </defs>
                <path class="gauge-track" d="M 25,110 A 75,75 0 0,1 175,110" stroke="url(#gaugeGrad)" />
            </svg>
            <div class="needle-container">
                <div id="gaugeNeedle" class="needle"></div>
                <div class="needle-pivot"></div>
            </div>
        </div>

        <div class="footer-area">
            <div id="statusLabel" class="status-label">Tap Here to Start...</div>
            <button id="startButton">Activate Meter</button>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const gaugeNeedle = document.getElementById('gaugeNeedle');
        const statusLabel = document.getElementById('statusLabel');
        const instruction = document.getElementById('instruction');
        const debugLog = document.getElementById('debugLog');

        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        
        let currentNeedlePosition = 0; 
        const decayRate = 0.003; 
        let isRunning = false; 
        const volumeThreshold = 45;

        function log(msg) {
            debugLog.innerText = "System: " + msg;
            console.log(msg);
        }

        function initMicrophone() {
            if (isRunning) return; 
            log("Click registered. Initializing...");
            
            statusLabel.innerText = "Connecting...";
            instruction.innerText = "Opening browser microphone interface...";

            // Robust multi-browser fallback selection loop
            const getMedia = navigator.mediaDevices?.getUserMedia?.bind(navigator.mediaDevices) || 
                             navigator.getUserMedia || 
                             navigator.webkitGetUserMedia || 
                             navigator.mozGetUserMedia || 
                             navigator.msGetUserMedia;

            if (!getMedia) {
                log("Audio pipeline entirely unsupported in this browser container.");
                alert("Browser Error: Hardware media pipelines are unavailable. Try switching to a standard native browser like Chrome or Safari.");
                return;
            }

            log("Firing request constraints window...");
            
            // Standardizing the media request query pattern to execute immediately
            const constraints = { audio: true, video: false };
            
            const successCallback = function(stream) {
                log("Stream acquired. Launching Audio Context...");
                startButton.classList.add('hidden');
                instruction.innerText = "Connected! Make some noise to test your Christmas spirit!";

                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
